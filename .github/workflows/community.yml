name: Discord Community

on:
  discussion:
    types: [created, answered]
  issues:
    types: [opened, closed]
  pull_request:
    types: [opened, closed, merged]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord notification
        run: |
          echo "New activity: ${{ github.event_name }}"
